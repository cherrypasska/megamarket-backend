syntax = "proto3";

package inventory;

option java_multiple_files = true;
option java_package = "client.inventory.response.grpc";

message ProductQuery {
  int64 productId = 1;
  int64 quantity = 2;
}

enum ProductStatus {
  OK = 0;
  NOT_FOUND = 1;
  INSUFFICIENT_QUANTITY = 2;
}

message ProductInfo {
  int64 productId = 1;
  string name = 2;
  double price = 3;
  double discount = 4;
  int64 availableQuantity = 5;
  ProductStatus status = 6;
}

message InventoryRequest {
  repeated ProductQuery products = 1;
}

message InventoryResponse {
  repeated ProductInfo items = 1;
}

service InventoryService {
  rpc checkInventory(InventoryRequest) returns (InventoryResponse);
  rpc addOrder(InventoryRequest) returns (InventoryResponse);
}